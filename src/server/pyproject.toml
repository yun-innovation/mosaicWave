[project]
name = "mosaicwave"
version = "0.1.1"
description = "mosaicWave photo library API"
license = { text = "FSL-1.1-ALv2" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pillow>=10.0",
  "pillow-heif>=0.16",
  "python-multipart>=0.0.9",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mosaicwave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
