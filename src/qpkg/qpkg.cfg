# mosaicWave QPKG metadata. Built with QDK (`qbuild`) on Linux/NAS. See doc/qpkg.md.
# This file must be LF (no CR). CR is copied into QPKG_NAME/VER and breaks the .qpkg filename and icons.

QPKG_NAME="mosaicWave"
QPKG_DISPLAY_NAME="mosaicWave"
QPKG_VER="0.1.0"
QPKG_AUTHOR="Yun Innovation Technology Limited"
QPKG_LICENSE="FSL-1.1-ALv2"
QPKG_SUMMARY="Photo and video library (Python API + static web UI)."
QPKG_RC_NUM="187"
QPKG_SERVICE_PROGRAM="mosaicWave.sh"
QPKG_WEBUI="/"
# Default UI/API port. Change later: /share/.../mosaicWave.sh port 8100
# Stored as Web_Port in /etc/config/qpkg.conf (QTS desktop uses this).
QPKG_WEB_PORT="8090"
# App Center rejects the package on older firmware (e.g. TS-431 QTS 4.3.6).
QTS_MINI_VERSION="5.0.0"
# Enable may still pip-install if post-install could not reach PyPI.
QPKG_TIMEOUT="300,30"
# 1 = open the UI in a QTS desktop window (not a new browser tab). Drag from Main menu to pin a shortcut.
QPKG_DESKTOP_APP="1"
QPKG_DESKTOP_APP_WIN_WIDTH="1178"
QPKG_DESKTOP_APP_WIN_HEIGHT="600"
# Show in the QTS Main menu for all NAS users (authorization is still source_grant in the app).
QPKG_VISIBLE="2"
# Python 3 QPKG (3.10+) must be installed first. Official name is Python3.
QPKG_REQUIRE="Python3 | QPython312"
QPKG_REQUIRE_MSG="App Center Python 3 or QPython312 (3.10 or newer)"
